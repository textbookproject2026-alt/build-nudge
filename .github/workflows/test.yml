name: test

# Tests and bundles the Worker. On main, a green run starts deploy.yml, which
# deploys it (README, "Deploying"); the Cloudflare credential is used only there.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm test
      - name: Bundle without deploying
        run: npm run check
